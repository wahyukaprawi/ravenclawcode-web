<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0175C2">
  <link rel="stylesheet" href="styles.css">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ravenclawcode">
  <link rel="apple-touch-icon" href="icons/icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2" />
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2" />

  <title>ravenclawcode</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function () {
      var DARK_FILTER = 'invert(1) hue-rotate(180deg)';

      function paintGlass(theme) {
        try {
          document.querySelectorAll('flt-glass-pane').forEach(function (host) {
            var root = host.shadowRoot;
            if (!root) {
              host.style.filter = theme === 'dark' ? DARK_FILTER : '';
              return;
            }
            var id = 'raven-dark-style';
            var existing = root.getElementById(id);
            if (theme === 'dark' && !existing) {
              var st = document.createElement('style');
              st.id = id;
              st.textContent = ':host{filter:' + DARK_FILTER + '}';
              root.appendChild(st);
            } else if (theme !== 'dark' && existing) {
              existing.remove();
            }
          });
        } catch (e) { }
      }

      function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        paintGlass(theme);
      }

      function currentTheme() {
        return document.documentElement.getAttribute('data-theme') || 'light';
      }

      try {
        new MutationObserver(function () {
          if (document.querySelector('flt-glass-pane')) paintGlass(currentTheme());
        }).observe(document.documentElement, { childList: true, subtree: true });
      } catch (e) { }
      window.addEventListener('flutter-first-frame', function () {
        paintGlass(currentTheme());
      });

      try {
        var saved = localStorage.getItem('theme');
        applyTheme(saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      } catch (e) {
        applyTheme('light');
      }

      document.addEventListener('click', function (ev) {
        var btn = ev.target && ev.target.closest ? ev.target.closest('#theme-toggle') : null;
        if (!btn) return;
        var next = currentTheme() === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        try { localStorage.setItem('theme', next); } catch (e) { }
      }, true);
    })();
  </script>
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
  <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round">
      <circle cx="12" cy="12" r="5" />
      <line x1="12" y1="1" x2="12" y2="3" />
      <line x1="12" y1="21" x2="12" y2="23" />
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
      <line x1="1" y1="12" x2="3" y2="12" />
      <line x1="21" y1="12" x2="23" y2="12" />
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
    </svg>
  </button>
</body>

</html>
